name: Extract M3U8

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Daftar URL (pisahkan dengan koma)'
        required: false
        default: ''
      referer:
        description: 'Referer (default: https://9tsu.vip/)'
        required: false
        default: 'https://9tsu.vip/'
  schedule:
    - cron: '0 0 * * *'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run extraction
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
          REFERER: ${{ github.event.inputs.referer || 'https://9tsu.vip/' }}
          DB_PATH: playlist.db
          JSON_PATH: output.json
          M3U8_PATH: output.m3u8
          DEBUG: true
        run: node extract.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-links
          path: |
            output.m3u8
            output.json
            playlist.db
            debug-*.html
            error-*.png
            error-*.html

      - name: Commit changes (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.m3u8 output.json playlist.db
          git diff --staged --quiet || git commit -m "Update extracted data [skip ci]" && git push
        continue-on-error: true
