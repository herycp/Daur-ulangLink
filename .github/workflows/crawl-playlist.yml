name: Auto Scrape muxalor M3U8 Streams

on:
  # schedule:
    # Berjalan otomatis setiap 6 jam sekali
    #- cron: '0 */6 * * *'
  # Memungkinkan pemicuan manual langsung dari tab Actions GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: Run Scraper Script
        run: node scraper.js
        env:
          BATCH_LIMIT: 50 # Anda bisa mengubah jumlah batch per run di sini

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pastikan progress.json juga di-track agar riwayat pengerjaan tersimpan
          git add streams/ output.json playlist.m3u progress.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update muxalor streams and progress [skip ci]"
            git push
          else
            echo "Tidak ada perubahan file baru."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
